<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referral Sim</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --quiet:#6b6a66; --line:#dcdad4;
          --in:#e8f0fe; --out:#eef6ea; --accent:#2f5d9e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --ink:#ecebe6; --quiet:#a3a19a; --line:#3a3936;
            --in:#1e2a3d; --out:#1f2e1d; --accent:#8fb3ec; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center;
           border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0 12px 0 0; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #status { color:var(--quiet); font-size:13px; }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; padding:16px; }
  .phone { background:var(--card); border:1px solid var(--line); border-radius:12px;
           display:flex; flex-direction:column; height:70vh; min-height:360px; }
  .phone h2 { font-size:14px; margin:0; padding:12px; border-bottom:1px solid var(--line); }
  .phone h2 small { color:var(--quiet); font-weight:400; display:block; }
  .log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 10px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
  .msg.in { align-self:flex-end; background:var(--in); }
  .msg.out { align-self:flex-start; background:var(--out); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input { flex:1; min-width:0; font:inherit; padding:6px 8px; border-radius:8px;
          border:1px solid var(--line); background:var(--bg); color:var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Referral Sim <span id="mode" style="color:var(--quiet);font-weight:400">· SIM_MODE, no real SMS</span></h1>
  <button class="primary" id="refer">Create referral R-0142</button>
  <span id="status">No case yet</span>
</header>
<main id="phones"></main>
<script>
const PHONES = [["patient", "Patient"], ["chw", "Health worker (CHW)"], ["clinic", "Clinic front desk"]];
let cfg = null;

function phoneCard(role, label, number, sub) {
  const el = document.createElement("section");
  el.className = "phone";
  el.innerHTML = `<h2>${label}<small>${number}${sub ? " · " + sub : ""}</small></h2>
    <div class="log" id="log-${role}"></div>
    <form id="form-${role}"><input placeholder="Type an SMS" aria-label="SMS from ${label}"><button>Send</button></form>`;
  el.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = e.target.querySelector("input");
    const body = input.value.trim();
    if (!body) return;
    input.value = "";
    await fetch("/sim/send", { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify({ from: number, body }) });
    refresh();
  });
  return el;
}

async function refresh() {
  const { messages, case: c } = await (await fetch("/sim/transcript")).json();
  for (const [role] of PHONES) {
    const log = document.getElementById(`log-${role}`);
    const mine = messages.filter((m) => m.phone === cfg[role]);
    if (log.childElementCount === mine.length) continue;
    log.replaceChildren(...mine.map((m) => {
      const d = document.createElement("div");
      d.className = `msg ${m.dir}`;
      d.textContent = m.body;
      return d;
    }));
    log.scrollTop = log.scrollHeight;
  }
  document.getElementById("status").textContent = c
    ? `${c.id} · ${c.status} · escalation: ${c.escalation}${c.visit_date ? " · visit " + c.visit_date : ""}`
    : "No case yet";
}

(async () => {
  cfg = await (await fetch("/sim/config")).json();
  const main = document.getElementById("phones");
  main.append(phoneCard("patient", "Patient", cfg.patient),
              phoneCard("chw", "Health worker (CHW)", cfg.chw),
              phoneCard("clinic", "Clinic front desk", cfg.clinic, cfg.clinic_name));
  document.getElementById("refer").addEventListener("click", async () => {
    await fetch("/sim/referral", { method: "POST" });
    refresh();
  });
  refresh();
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
